
site_name: PulseDash
site_description: Documentation technique du projet PulseDash
site_author: PuffinIT
repo_url: https://github.com/floorian651/pulsedash
repo_name: pulsedash

theme:
  name: material
  language: fr
  # logo: assets/logo.png
  # favicon: assets/favicon.png

  # Configuration du mode Sombre / Clair
  palette:
    # Mode Clair (par défaut)
    - scheme: default
      primary: indigo
      accent: purple
      toggle:
        icon: material/weather-night
        name: Passer au mode sombre

    # Mode Sombre
    - scheme: slate
      primary: indigo
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Passer au mode clair

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy

nav:
  - Accueil: index.md
  - PulseDash: game.md
  - API:
    - Vue d'ensemble: api/index.md
    - Architecture: api/architecture.md
    - Authentification: api/authentication.md
    - Endpoints:
      - Vue d'ensemble: api/endpoints/index.md
      - Auth: api/endpoints/auth.md
      - Musiques: api/endpoints/music.md
      - Génération: api/endpoints/generate.md
      - Jobs: api/endpoints/jobs.md
      - Jamendo: api/endpoints/jamendo.md
      - Playlists: api/endpoints/playlists.md
      - Tracks: api/endpoints/tracks.md
      - Scores: api/endpoints/scores.md
      - Sessions de jeu: api/endpoints/game-sessions.md
      - Profil: api/endpoints/profile.md
    - Modèles de données: api/models.md
    - WebSocket: api/websocket.md
    - Codes d'erreur: api/errors.md
    - Réseau (iptables): api/iptables.md
  - Développement:
    - CI/CD: dev/ci-cd.md

markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

  # Configuration Mermaid
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - awesome-pages

extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css
