[project]
name = "wavr"
version = "0.0.1"
dependencies = [
    "alembic",
    "boto3",
    "celery",
    "fastapi[standard]",
    "librosa",
    "loguru",
    "minio",
    "numpy",
    "psycopg2-binary",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "redis",
    "requests",
    "scipy",
    "SQLAlchemy",
    "uvicorn[standard]"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
]
